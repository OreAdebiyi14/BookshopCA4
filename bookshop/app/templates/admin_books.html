{% extends "base.html" %}
{% block content %}
<h2>All Books</h2>
<a href="{{ url_for('main.add_book') }}">+ Add Book</a>
<ul>
  {% for book in books %}
    <li>
      {{ book.title }} by {{ book.author }} - €{{ book.price }}
      <a href="{{ url_for('main.delete_book', book_id=book.id) }}">Delete</a>
    </li>
  {% endfor %}
</ul>
{% endblock %}
