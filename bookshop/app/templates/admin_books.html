{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">Admin: Manage Books</h2>
<a href="{{ url_for('main.add_book') }}" class="btn btn-success mb-3">+ Add Book</a>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Title</th>
      <th>Author</th>
      <th>Price</th>
      <th>Stock</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for book in books %}
    <tr>
      <td>{{ book.title }}</td>
      <td>{{ book.author }}</td>
      <td>€{{ book.price }}</td>
      <td>
        <form action="{{ url_for('main.update_stock', book_id=book.book_id) }}" method="POST" class="d-flex">
          <input type="number" name="stock" value="{{ book.stock_quantity }}" min="0" class="form-control form-control-sm me-2" style="width: 80px;">
          <button class="btn btn-sm btn-outline-primary">Update</button>
        </form>
      </td>
      <td>
        <a href="{{ url_for('main.edit_book', book_id=book.book_id) }}" class="btn btn-sm btn-warning">Edit</a>
        <a href="{{ url_for('main.delete_book', book_id=book.book_id) }}" class="btn btn-sm btn-danger">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
<div class="mt-4">
  <a href="{{ url_for('main.home') }}" class="btn btn-outline-secondary">← Return to Home</a>
</div>

{% endblock %}
