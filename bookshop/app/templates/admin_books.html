{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">Admin: Manage Books</h2>
<a href="{{ url_for('main.add_book') }}" class="btn btn-success mb-3">+ Add Book</a>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Title</th>
      <th>Author</th>
      <th>Price</th>
      <th>Stock</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for book in books %}
    <tr>
      <td>{{ book.title }}</td>
      <td>{{ book.author }}</td>
      <td>€{{ book.price }}</td>
      <td>{{ book.stock_quantity }}</td>
      <td>
        <a href="{{ url_for('main.edit_book', book_id=book.book_id) }}" class="btn btn-sm btn-warning">Edit</a>
        <a href="{{ url_for('main.delete_book', book_id=book.book_id) }}" class="btn btn-sm btn-danger">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
